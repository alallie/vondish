<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>v o n d i s h - Notes</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont,
                  "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    body {
      background: #f5f4f0;
      color: #222;
      max-width: 600px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    header {
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.04em;
      margin: 0;
    }

    header p {
      color: #777;
      margin: 4px 0 0;
    }

    /* Individual posts */

    article {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    /* Dates */

    article time {
      display: block;
      color: #999;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }

    /* Text */

    article p {
      margin: 0 0 12px;
    }

    article p:last-child {
      margin-bottom: 0;
    }

    article h2 {
      font-size: 1.3rem;
      line-height: 1.3;
      margin: 0 0 12px;
    }

    /* Images */

    article img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    article figure {
      margin: 0;
    }

    article figcaption {
      color: #777;
      font-size: 0.9rem;
      margin-top: 12px;
    }

    /* Links */

    a {
      color: #2478b5;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    article.link h2 {
      font-size: 1.3rem;
      line-height: 1.4;
      margin: 0 0 12px;
    }

    article.link h2 a {
      color: #2478b5;
      text-decoration: none;
    }

    article.link h2 a:hover {
      text-decoration: underline;
    }



    /* Footer */

    footer {
      display: flex;
      justify-content: space-between;
      padding: 12px 0 32px;
      font-size: 0.9rem;
    }

    /* Small screens */

    @media (max-width: 480px) {
      body {
        padding: 24px 12px;
      }

      article {
        padding: 20px;
        margin-bottom: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Notes</h1>
    <p>Thoughts, links, and other things.</p>
  </header>

  <main>
    <article>
      <time>October 11, 2026</time>
      <p>
        The Hobbit is the next up on my reading list.
        To be followed by The Lord of the Rings.
      </p>
    </article>



  </main>

</body>
</html>
