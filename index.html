<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <title>v o n d i s h</title>
    <style>
      :root {
        color-scheme: light;
        background: #f5f4f0;
        color: #41413f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
      }

      h1 {
        margin: 0;
        padding: 1rem;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        font-variant-caps: all-small-caps;
        font-weight: 400;
        letter-spacing: clamp(0.2em, 1vw, 0.35em);
        line-height: 1;
        text-align: center;
      }

      h1 a {
        color: inherit;
        cursor: text;
        text-decoration: none;
      }

      h1 a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 0.2em;
      }

      links {
        display: none;
      }
    </style>
    <script src="./script/spotlight-links.js" defer></script>
  </head>
  <body>
    <main>
      <h1>vondish</h1>
    </main>
    <links>
      <a href="/notes" title="My Blog">Notes</a>
      <a href="https://www.fastmail.com/" title="Email">Fastmail</a>
      <a href="https://github.com/" title="Code">GitHub</a>
      <a href="https://news.ycombinator.com/" title="Tech News">Hacker News</a>
      <a href="https://assistant.kagi.com/" title="Chatbot">Kagi Assistant</a>
      <a href="https://letterboxd.com/" title="IMDB replacaement">Letterboxd</a>
      <a href="https://thetvdb.com/" title="IMDB replacement">TheTVDB</a>
      <a href="https://wallhaven.cc/" title="Desktop wallpapers">Wallhaven</a>
      <a href="https://web.archive.org/" title="Archive.org">WayBackMachine</a>
      <a href="https://www.youtube.com/feed/subscriptions" title="YouTube Subscriptions">YouTube</a>
    </links>
  </body>
</html>
